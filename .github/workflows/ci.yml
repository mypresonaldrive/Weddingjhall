name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 action runtime
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, Node 24 action runtime
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply all migrations and test SaaS invariants
        run: npm run test:saas
      - name: Messaging wallet, consent, encryption and provider mocks
        run: npm run test:messaging
      - name: Production HTTP security smoke tests (no live services)
        run: npm run test:saas:http
      - name: Booking, pricing, auth, printing and deployment regressions
        run: npm run test:deployment
