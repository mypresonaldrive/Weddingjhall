services:
  gatherhall:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_MODE: saas
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    # All production data lives in Supabase; no SQLite production volume.
    stop_grace_period: 15s
